      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b1020"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#g)" stroke-width="3.2" opacity=".55"/>
  <ellipse cx="32" cy="32" rx="21" ry="8.5" fill="none" stroke="url(#g)" stroke-width="4.6" transform="rotate(-25 32 32)"/>
  <ellipse cx="32" cy="32" rx="21" ry="8.5" fill="none" stroke="url(#g)" stroke-width="4.6" transform="rotate(65 32 32)"/>
  <circle cx="32" cy="32" r="5.5" fill="#e9edf6"/>
